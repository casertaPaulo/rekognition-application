aws:
  s3:
    bucket-name: "app-caserta-2025"
    subdirectory: "tests/"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/appdb
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true


